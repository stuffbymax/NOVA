[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova"
version = "0.0.0"
description = "Network for Orbital Ventures and Ascension"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
    "pygame-gui>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nova = "nova.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
